<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title description">
  <title id="title">PaleHorse intro script</title>
  <desc id="description">April 2026 · Bash scripting. A small sailboat at a sunny seaside.</desc>
  <defs>
    <clipPath id="edge"><rect x="1" y="1" width="1198" height="238" rx="24"/></clipPath>
    <clipPath id="sailing-area"><rect x="790" y="24" width="410" height="216"/></clipPath>
    <g id="boat">
      <path class="rigging" d="M1008 49v138m-87-17h158"/>
      <path class="sail" d="m998 61-74 101h74Z"/>
      <path class="rigging" d="m998 61-74 101h74Z"/>
      <path class="gold" d="m998 61-16 22v79h16Z"/>
      <path class="sail" d="m1018 77 59 85h-59Z"/>
      <path class="rigging" d="m1018 77 59 85h-59Z"/>
      <path class="accent" d="M1008 49h27l-9 8h-18Z"/>
      <path class="hull" d="M905 179h183l-23 24c-42 11-107 6-135-1Z"/>
      <path class="rigging" d="M905 179h183l-23 24c-42 11-107 6-135-1Z"/>
      <path class="sail" opacity=".9" d="M932 184h132l-6 6H938Z"/>
    </g>
  </defs>
  <style>
    .sky{fill:#fff8e8}.wash{fill:#dff5f9}.coast{fill:#e5d0a1}.ocean{fill:#16636f}.sun{fill:#f6dcaf}.sail{fill:#fffcf6}.hull{fill:#834d37}.ink{fill:#081823}.muted{fill:#133b58}.accent{fill:#16636f}.gold{fill:#e5d0a1}.line{fill:#16636f}.wave{fill:#dff5f9}.border{fill:#e5d0a1}.rigging{fill:none;stroke:#16636f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wave{fill:none;stroke:#dff5f9;stroke-width:2;stroke-linecap:round;opacity:.65}.border{fill:none;stroke:#e5d0a1;stroke-width:2}
    .boat-rock{transform-origin:1000px 184px;animation:gentle-bob 8s ease-in-out infinite}
    .surface-wave{animation:passing-wave 8s ease-in-out infinite}
    .wave-back{animation-delay:-2s}
    .breeze{animation:sea-breeze 8s ease-in-out infinite;opacity:0}
    .breeze-lines{fill:none;stroke:#16636f;stroke-width:1.5;stroke-linecap:round}
    .still-water{display:none}
    @keyframes gentle-bob{0%,50%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(3px) rotate(0.35deg)}75%{transform:translateY(-3px) rotate(-0.35deg)}}
    @keyframes passing-wave{0%,100%{d:path('M780 211 C798.333 209.429 816.667 208 835 208 C853.333 208 871.667 209.429 890 211 C908.333 212.571 926.667 214 945 214 C963.333 214 981.667 212.571 1000 211 C1018.333 209.429 1036.667 208 1055 208 C1073.333 208 1091.667 209.429 1110 211 C1128.333 212.571 1146.667 214 1165 214 C1183.333 214 1201.667 212.571 1220 211')}25%{d:path('M780 214 C798.333 214 816.667 212.571 835 211 C853.333 209.429 871.667 208 890 208 C908.333 208 926.667 209.429 945 211 C963.333 212.571 981.667 214 1000 214 C1018.333 214 1036.667 212.571 1055 211 C1073.333 209.429 1091.667 208 1110 208 C1128.333 208 1146.667 209.429 1165 211 C1183.333 212.571 1201.667 214 1220 214')}50%{d:path('M780 211 C798.333 212.571 816.667 214 835 214 C853.333 214 871.667 212.571 890 211 C908.333 209.429 926.667 208 945 208 C963.333 208 981.667 209.429 1000 211 C1018.333 212.571 1036.667 214 1055 214 C1073.333 214 1091.667 212.571 1110 211 C1128.333 209.429 1146.667 208 1165 208 C1183.333 208 1201.667 209.429 1220 211')}75%{d:path('M780 208 C798.333 208 816.667 209.429 835 211 C853.333 212.571 871.667 214 890 214 C908.333 214 926.667 212.571 945 211 C963.333 209.429 981.667 208 1000 208 C1018.333 208 1036.667 209.429 1055 211 C1073.333 212.571 1091.667 214 1110 214 C1128.333 214 1146.667 212.571 1165 211 C1183.333 209.429 1201.667 208 1220 208')}}
    @keyframes sea-breeze{0%{transform:translateX(-120px);opacity:0}25%{transform:translateX(-40px);opacity:0.22}50%{transform:translateX(40px);opacity:0.132}75%,100%{transform:translateX(120px);opacity:0}}
    @media(prefers-reduced-motion:reduce){.boat-rock,.surface-wave,.breeze{animation:none;transform:none}.animated-water,.breeze{display:none}.still-water{display:inline}}
  </style>
  <g clip-path="url(#edge)">
    <rect class="sky" width="1200" height="240"/>
    <g aria-hidden="true">
      <path class="wash" d="M827 240c-49-44-48-111 5-162 50-49 155-73 248-45 68 20 107 38 120 55v152Z"/>
      <circle class="sun" cx="1122" cy="62" r="22"/>
      <path class="coast" opacity=".55" d="M860 192c38-31 74-20 108-31 37-12 54-8 81 2 35 13 68-5 107-4 17 0 32 4 44 9v72H860Z"/>
      <path class="ocean" d="M730 240c35-45 83-48 139-36 52 11 98 7 140-1 66-12 102-20 191-2v39Z"/>
      <g clip-path="url(#sailing-area)">
        <g class="breeze">
          <path class="breeze-lines" d="M916 93h34c13 0 20-4 23-10m-80 31h37c16 0 23-4 29-11m-24 36h27c10 0 18-3 22-9"/>
        </g>
        <g class="boat-rock"><use href="#boat"/></g>
        <g class="animated-water wave" opacity=".75">
          <path class="surface-wave" d="M780 211 C798.333 209.429 816.667 208 835 208 C853.333 208 871.667 209.429 890 211 C908.333 212.571 926.667 214 945 214 C963.333 214 981.667 212.571 1000 211 C1018.333 209.429 1036.667 208 1055 208 C1073.333 208 1091.667 209.429 1110 211 C1128.333 212.571 1146.667 214 1165 214 C1183.333 214 1201.667 212.571 1220 211"/>
          <g transform="translate(0 18)" opacity=".6"><path class="surface-wave wave-back" d="M780 211 C798.333 209.429 816.667 208 835 208 C853.333 208 871.667 209.429 890 211 C908.333 212.571 926.667 214 945 214 C963.333 214 981.667 212.571 1000 211 C1018.333 209.429 1036.667 208 1055 208 C1073.333 208 1091.667 209.429 1110 211 C1128.333 212.571 1146.667 214 1165 214 C1183.333 214 1201.667 212.571 1220 211"/></g>
        </g>
        <g class="still-water">
          <path class="wave" d="M779 223c30-9 54-7 80-2m51 3c35 0 59-4 83-7m65 0c29-6 57-6 89 0"/>
          <path class="wave" d="M895 235c38-1 71-5 104-10m70 4c26-3 50-2 76 2"/>
        </g>
      </g>
      <rect class="accent" x="64" y="180" width="72" height="4" rx="2"/>
      <rect class="gold" x="144" y="180" width="36" height="4" rx="2"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text class="ink" x="62" y="103" font-size="44" font-weight="700" letter-spacing=".25">PaleHorse intro script</text>
      <text class="muted" x="64" y="147" font-size="21" font-weight="400">April 2026 · Bash scripting</text>
    </g>
  </g>
  <rect class="border" x="1" y="1" width="1198" height="238" rx="24"/>
</svg>
