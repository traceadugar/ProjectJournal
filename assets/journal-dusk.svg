<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title description">
  <title id="title">Project Journal</title>
  <desc id="description">Linux, systems &amp; AI-assisted learning. A dusk seaside scene with a rotating lighthouse beam that illuminates the journal heading.</desc>
  <defs>
    <clipPath id="edge"><rect x="1" y="1" width="1198" height="238" rx="24"/></clipPath>
    <radialGradient id="beam-strength" gradientUnits="userSpaceOnUse" cx="993.5" cy="84.5" r="1800">
      <stop offset="0" stop-color="white" stop-opacity=".86"/>
      <stop offset=".18" stop-color="white" stop-opacity=".72"/>
      <stop offset=".5" stop-color="white" stop-opacity=".5"/>
      <stop offset=".76" stop-color="white" stop-opacity=".24"/>
      <stop offset=".95" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beam-atmosphere" gradientUnits="userSpaceOnUse" cx="993.5" cy="84.5" r="1800">
      <stop offset="0" stop-color="white" stop-opacity=".9"/>
      <stop offset=".18" stop-color="white" stop-opacity=".72"/>
      <stop offset=".5" stop-color="white" stop-opacity=".36"/>
      <stop offset=".74" stop-color="white" stop-opacity=".08"/>
      <stop offset=".9" stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="beam-soften" x="-10%" y="-15%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <radialGradient id="front-density">
      <stop offset="0" stop-color="white" stop-opacity=".74"/>
      <stop offset=".4" stop-color="white" stop-opacity=".66"/>
      <stop offset=".78" stop-color="white" stop-opacity=".54"/>
      <stop offset=".95" stop-color="white" stop-opacity=".08"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="ink-threshold" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="240" color-interpolation-filters="sRGB">
      <feComponentTransfer><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
    </filter>
    <g id="lighthouse-field">
      <g class="beam-rotor">
        <path d="M993.5 84.5L-675.431 -589.792A1800 1800 0 0 0 -675.431 758.792Z" fill="url(#beam-strength)" filter="url(#beam-soften)"/>
      </g>
      <g class="beam-front-cone">
        <ellipse cx="993.5" cy="84.5" rx="1450" ry="290" fill="url(#front-density)"/>
      </g>
    </g>
    <mask id="lighthouse-light" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1200" height="240" style="mask-type:alpha">
      <use href="#lighthouse-field"/>
    </mask>
    <mask id="lighthouse-sweep" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1200" height="240" style="mask-type:alpha">
      <use href="#lighthouse-field" filter="url(#ink-threshold)"/>
    </mask>
    <mask id="lighthouse-glow" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1200" height="240" style="mask-type:alpha">
      <g class="beam-rotor">
        <path d="M993.5 84.5L-637.854 -676.213A1800 1800 0 0 0 -637.854 845.213Z" fill="url(#beam-atmosphere)" filter="url(#beam-soften)"/>
      </g>
      <g class="beam-front-cone">
        <ellipse cx="993.5" cy="84.5" rx="1580" ry="335" fill="url(#front-haze)"/>
      </g>
    </mask>
    <radialGradient id="lantern-halo">
      <stop offset="0" stop-color="#fce0a2" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fce0a2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="viewer-glow">
      <stop offset="0" stop-color="#fff6df" stop-opacity="1"/>
      <stop offset=".6" stop-color="#fff6df" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff6df" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="front-haze">
      <stop offset="0" stop-color="white" stop-opacity="1"/>
      <stop offset=".6" stop-color="white" stop-opacity=".6"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sky{fill:#051026}.wash{fill:#1e2046}.coast{fill:#4a4fae}.ocean{fill:#113888}.sun{fill:#fce0a2}.tower{fill:#f2e5e3}.roof{fill:#fce0a2}.window{fill:#fce0a2}.ink{fill:#f2e5e3}.muted{fill:#cebdda}.accent{fill:#fce0a2}.gold{fill:#4a4fae}.line{fill:none;stroke:#051026;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.wave{fill:none;stroke:#cebdda;stroke-width:2;stroke-linecap:round;opacity:.65}.border{fill:none;stroke:#4a4fae;stroke-width:2}
    .beam-rotor{transform-box:view-box;transform-origin:993.5px 84.5px;animation:beacon-orbit 16s linear infinite,beacon-depth 16s linear infinite}
    .beam-light{fill:#fff9ed}
    .beam-halo{fill:#fff1d7;opacity:0.28}
    .ink,.muted{stroke:#051026;stroke-width:1.15;stroke-linejoin:round;paint-order:stroke fill}
    .beam-ink{fill:#051026;stroke:none}
    .beam-front-glint{animation:beacon-front 16s linear infinite}
    .beam-front-cone{transform-box:view-box;transform-origin:993.5px 84.5px;animation:beacon-cone 16s linear infinite}
    @keyframes beacon-orbit{0%{transform:scale(1,0.12)}3.125%{transform:scale(0.980785,0.135217)}6.25%{transform:scale(0.92388,0.149849)}9.375%{transform:scale(0.83147,0.163334)}12.5%{transform:scale(0.707107,0.175154)}15.625%{transform:scale(0.55557,0.184855)}18.75%{transform:scale(0.382683,0.192063)}21.875%{transform:scale(0.19509,0.196501)}25%{transform:scale(0,0.198)}28.125%{transform:scale(-0.19509,0.196501)}31.25%{transform:scale(-0.382683,0.192063)}34.375%{transform:scale(-0.55557,0.184855)}37.5%{transform:scale(-0.707107,0.175154)}40.625%{transform:scale(-0.83147,0.163334)}43.75%{transform:scale(-0.92388,0.149849)}46.875%{transform:scale(-0.980785,0.135217)}50%{transform:scale(-1,0.12)}53.125%{transform:scale(-0.980785,0.12)}56.25%{transform:scale(-0.92388,0.12)}59.375%{transform:scale(-0.83147,0.12)}62.5%{transform:scale(-0.707107,0.12)}65.625%{transform:scale(-0.55557,0.12)}66.666667%{transform:scale(-0.5,0.12)}68.75%{transform:scale(-0.382683,0.12)}71.875%{transform:scale(-0.19509,0.12)}75%{transform:scale(0,0.12)}78.125%{transform:scale(0.19509,0.12)}78.333333%{transform:scale(0.207912,0.12)}81.25%{transform:scale(0.382683,0.12)}84.375%{transform:scale(0.55557,0.12)}87.5%{transform:scale(0.707107,0.12)}90.625%{transform:scale(0.83147,0.12)}93.75%{transform:scale(0.92388,0.12)}96.875%{transform:scale(0.980785,0.12)}100%{transform:scale(1,0.12)}}
    @keyframes beacon-depth{0%{opacity:1}3.125%{opacity:1}6.25%{opacity:1}9.375%{opacity:1}12.5%{opacity:1}15.625%{opacity:1}18.75%{opacity:1}21.875%{opacity:1}25%{opacity:1}28.125%{opacity:1}31.25%{opacity:1}34.375%{opacity:1}37.5%{opacity:1}40.625%{opacity:1}43.75%{opacity:1}46.875%{opacity:1}50%{opacity:1}53.125%{opacity:0.8125}56.25%{opacity:0.625}59.375%{opacity:0.4375}62.5%{opacity:0.25}65.625%{opacity:0.0625}66.666667%{opacity:0}68.75%{opacity:0}71.875%{opacity:0}75%{opacity:0}78.125%{opacity:0.9375}78.333333%{opacity:1}81.25%{opacity:1}84.375%{opacity:1}87.5%{opacity:1}90.625%{opacity:1}93.75%{opacity:1}96.875%{opacity:1}100%{opacity:1}}
    @keyframes beacon-front{0%{opacity:0}3.125%{opacity:0}6.25%{opacity:0}9.375%{opacity:0}12.5%{opacity:0}15.625%{opacity:0}18.75%{opacity:0.019157}21.875%{opacity:0.372034}25%{opacity:1}28.125%{opacity:0.372034}31.25%{opacity:0.019157}34.375%{opacity:0}37.5%{opacity:0}40.625%{opacity:0}43.75%{opacity:0}46.875%{opacity:0}50%{opacity:0}53.125%{opacity:0}56.25%{opacity:0}59.375%{opacity:0}62.5%{opacity:0}65.625%{opacity:0}66.666667%{opacity:0}68.75%{opacity:0}71.875%{opacity:0}75%{opacity:0}78.125%{opacity:0}78.333333%{opacity:0}81.25%{opacity:0}84.375%{opacity:0}87.5%{opacity:0}90.625%{opacity:0}93.75%{opacity:0}96.875%{opacity:0}100%{opacity:0}}
    @keyframes beacon-cone{0%{transform:scale(0)}3.125%{transform:scale(0.001449)}6.25%{transform:scale(0.021447)}9.375%{transform:scale(0.09527)}12.5%{transform:scale(0.25)}15.625%{transform:scale(0.477953)}18.75%{transform:scale(0.728553)}21.875%{transform:scale(0.925328)}25%{transform:scale(1)}28.125%{transform:scale(0.925328)}31.25%{transform:scale(0.728553)}34.375%{transform:scale(0.477953)}37.5%{transform:scale(0.25)}40.625%{transform:scale(0.09527)}43.75%{transform:scale(0.021447)}46.875%{transform:scale(0.001449)}50%{transform:scale(0)}53.125%{transform:scale(0)}56.25%{transform:scale(0)}59.375%{transform:scale(0)}62.5%{transform:scale(0)}65.625%{transform:scale(0)}66.666667%{transform:scale(0)}68.75%{transform:scale(0)}71.875%{transform:scale(0)}75%{transform:scale(0)}78.125%{transform:scale(0)}78.333333%{transform:scale(0)}81.25%{transform:scale(0)}84.375%{transform:scale(0)}87.5%{transform:scale(0)}90.625%{transform:scale(0)}93.75%{transform:scale(0)}96.875%{transform:scale(0)}100%{transform:scale(0)}}
    @media(prefers-reduced-motion:reduce){.beam-rotor,.beam-front-cone,.beam-front-glint{animation:none}.beam-layer{display:none}}
  </style>
  <g clip-path="url(#edge)">
    <rect class="sky" width="1200" height="240"/>
    <g aria-hidden="true">
      <path class="wash" d="M827 240c-49-44-48-111 5-162 50-49 155-73 248-45 68 20 107 38 120 55v152Z"/>
      <circle class="sun" cx="1081" cy="66" r="23"/>
      <path class="coast" d="M817 240c19-34 53-46 96-49 55-3 61-45 103-40 40 5 40 33 85 26 36-5 66-7 99 7v56Z"/>
      <path class="ocean" d="M730 240c35-45 83-48 139-36 52 11 98 7 140-1 66-12 102-20 191-2v39Z"/>
      <path class="wave" d="M779 222c30-9 54-7 80-2m52 4c34 0 47-4 71-7m63-1c37-7 69-8 104-1"/>
      <path class="wave" d="M895 235c38-1 71-5 104-10m70 4c26-3 50-2 76 2"/>
      <rect class="beam-halo beam-layer" width="1200" height="240" mask="url(#lighthouse-glow)"/>
      <rect class="beam-light beam-layer" width="1200" height="240" mask="url(#lighthouse-light)"/>
      <circle cx="993.5" cy="84.5" r="26" fill="url(#lantern-halo)"/>
      <g class="beam-layer beam-front-glint">
        <ellipse cx="993.5" cy="84.5" rx="980" ry="70" fill="url(#viewer-glow)" opacity="0.18"/>
        <circle cx="993.5" cy="84.5" r="58" fill="url(#lantern-halo)" opacity=".75"/>
      </g>
      <path class="tower" d="m978 94-13 82h57l-13-82Z"/>
      <path class="line" d="m978 94-13 82h57l-13-82Z"/>
      <rect class="tower" x="976" y="74" width="35" height="20" rx="2"/>
      <rect class="line" x="976" y="74" width="35" height="20" rx="2"/>
      <path class="roof" d="m971 72 23-17 22 17Z"/>
      <path class="line" d="m971 72 23-17 22 17Z"/>
      <rect class="window" x="986" y="80" width="15" height="9" rx="1"/>
      <path class="line" d="M970 143h46m-49 17h52m-25-35v8"/>
      <path class="roof" d="M989 176v-19a5 5 0 0 1 10 0v19Z"/>
      <path class="line" d="M953 178h81"/>
      <rect class="accent" x="64" y="180" width="72" height="4" rx="2"/>
      <rect class="gold" x="144" y="180" width="36" height="4" rx="2"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text class="ink" x="62" y="103" font-size="52" font-weight="700" letter-spacing="2">Project Journal</text>
      <text class="muted" x="64" y="147" font-size="21" font-weight="400">Linux, systems &amp; AI-assisted learning</text>
    </g>
    <g class="beam-layer" font-family="Segoe UI, Arial, sans-serif" mask="url(#lighthouse-sweep)" aria-hidden="true">
      <text class="beam-ink" x="62" y="103" font-size="52" font-weight="700" letter-spacing="2">Project Journal</text>
      <text class="beam-ink" x="64" y="147" font-size="21" font-weight="400">Linux, systems &amp; AI-assisted learning</text>
    </g>
  </g>
  <rect class="border" x="1" y="1" width="1198" height="238" rx="24"/>
</svg>
